name: Scheduled Backup

# हर रविवार रात ~2:00 AM IST (UTC 20:30 शनिवार) अपने-आप चलता है — पहले रोज़ चलता था, पूरे
# database का पूरा data पढ़ने से यह भी Firebase की Downloads billing quota में गिनता है, तो
# हफ़्ते में एक बार काफ़ी है (data safety बनी रहे, बेवजह रोज़ का extra खर्च न हो); "workflow_dispatch"
# से GitHub की "Actions" टैब से भी कभी भी मैन्युअली चलाया जा सकता है
on:
  schedule:
    - cron: '30 20 * * 0'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install backup dependencies
        # version pinned — अनजाने में नया (कभी breaking) major version अपने-आप न आ जाए।
        # firebase-admin@14.4.0 को Node >=22 चाहिए (package.json engines) — देखें deploy-rules.yml
        run: npm install --no-save firebase-admin@14.4.0 xlsx@0.18.5
      - name: Run backup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/backup.js
      # repo public है — artifact कोई भी logged-in GitHub user उतार सकता है। इसलिए Excel पर
      # पासवर्ड (AES-256) लगाकर ही रखें; secret न हो तो job फेल, बिना ताले की फ़ाइल कभी नहीं
      # (12/10/2026 — उससे पहले के सादे बैकअप मिटा दिए गए)। देखें scripts/encrypt-backup.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lock backup with password
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          pip install --quiet msoffcrypto-tool==5.4.2
          python3 scripts/encrypt-backup.py backup-output
      # Firebase/Google Cloud storage में कुछ भी सेव नहीं होता — फ़ाइल सिर्फ़ यहीं (GitHub
      # Actions artifact) बनती है, और तय दिनों बाद अपने-आप मिट जाती है — storage कभी नहीं बढ़ता
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: adegaon-backup-${{ github.run_id }}
          path: backup-output/*.xlsx
          retention-days: 30
          if-no-files-found: error
