name: Scheduled Backup

# हर रविवार रात ~2:00 AM IST (UTC 20:30 शनिवार) अपने-आप चलता है — पहले रोज़ चलता था, पूरे
# database का पूरा data पढ़ने से यह भी Firebase की Downloads billing quota में गिनता है, तो
# हफ़्ते में एक बार काफ़ी है (data safety बनी रहे, बेवजह रोज़ का extra खर्च न हो); "workflow_dispatch"
# से GitHub की "Actions" टैब से भी कभी भी मैन्युअली चलाया जा सकता है
on:
  schedule:
    - cron: '30 20 * * 0'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backup dependencies
        run: npm install --no-save firebase-admin xlsx
      - name: Run backup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/backup.js
      # Firebase/Google Cloud storage में कुछ भी सेव नहीं होता — फ़ाइल सिर्फ़ यहीं (GitHub
      # Actions artifact) बनती है, और तय दिनों बाद अपने-आप मिट जाती है — storage कभी नहीं बढ़ता
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: adegaon-backup-${{ github.run_id }}
          path: backup-output/*.xlsx
          retention-days: 30
