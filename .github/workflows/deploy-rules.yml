name: Deploy Firebase Rules

# database.rules.json बदलकर main में merge होते ही असली Firebase Realtime Database पर rules
# अपने-आप live हो जाती हैं — अब JE को हर बार Firebase Console में जाकर मैन्युअली paste/publish
# करने की ज़रूरत नहीं। workflow_dispatch से GitHub की "Actions" टैब से भी कभी भी मैन्युअली चलाया
# जा सकता है (जैसे repo और live-rules में drift का शक हो तो दोबारा sync करने के लिए)।
on:
  push:
    branches: [main]
    paths:
      - 'database.rules.json'
  workflow_dispatch: {}

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deploy dependencies
        # version pinned — अनजाने में नया (कभी breaking) major version अपने-आप न आ जाए।
        # firebase-admin@14.4.0 को Node >=22 चाहिए (package.json engines) — Node 20 पर
        # require("firebase-admin") से admin.credential ही undefined आता है, इसीलिए node-version
        # भी 22 किया (v9.146 के pin के साथ यह पहले नहीं पकड़ में आया — CI ने असली deploy पर ही बताया)
        run: npm install --no-save firebase-admin@14.4.0
      - name: Deploy rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/deploy-rules.js
