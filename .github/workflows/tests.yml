name: Tests

on:
  pull_request:
  push:
    branches: [main]

# checkout/setup-node v5 और Node 22 (10/10): v4 वाले औज़ार पुराने Node 20 पर चलते थे — GitHub ने चेतावनी
# दी थी, और Node 20 अप्रैल 2026 में ख़त्म (EOL) हो चुका। बाक़ी तीनों workflow पहले से Node 22 पर थे
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check-xss
      - run: npm run check-globals
      # v9.230: Firebase की 3 script का integrity hash असली gstatic की फ़ाइल से मिले — ग़लत hash = पूरे ऐप में
      # Firebase बंद, इसलिए merge से पहले यहीं (sandbox से gstatic बंद है, यह सिर्फ़ CI में असली मिलान करता है)
      - run: npm run check-sri -- --online
      - run: npm run check-actions
      # अपने-आप alert (scripts/check-alerts.js): क्या alert बने/न बने, issue में नाम न जाए, हर logErr नाम वर्गीकृत
      - run: npm run test:alerts
      # बैकअप से रिमार्क वापसी (scripts/restore-remarks.js): सिर्फ़ जोड़े, आज का न मिटे, दोबारा न जुड़े
      - run: npm run test:restore
      # कोड-गुणवत्ता कदम 3 (v9.198): type-जांच — नाम का टाइपो (CU.nmae), दूसरी फ़ाइल के function को ग़लत
      # गिनती में arguments, text पर संख्या वाला काम… जो ESLint नहीं पकड़ता। ऐप में कुछ नहीं जाता (tsconfig.json)
      - run: npm run typecheck
      - run: npm audit --audit-level=high

  smoke:
    runs-on: ubuntu-latest
    # 15 मिनट था — suite (~500 टेस्ट) अकेले ~14-15 मिनट लेता है, 10/10 को v9.195 के 8 नए टेस्ट
    # के बाद सीमा पर कटने लगा (टेस्ट फेल नहीं, "cancelled")। अटका टेस्ट फिर भी 60 सेकंड में ख़ुद फेल होता है
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  # पूरा ऐप Firebase के नक़ली सर्वर (emulator) पर — असली login (Auth) + database + rules (13/10/2026)।
  # smoke में Firebase बंद रहता है; यहां "सही PIN → वसूली सर्वर पर", "ग़लत PIN पर मना", "JE अपलोड सर्वर पर"
  # सचमुच चलते हैं। असली Firebase को नहीं छूता (project demo-…), देखें tests/e2e-firebase.spec.js
  e2e-firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Firebase Security Rules की असली जांच — Firebase के नक़ली सर्वर (emulator) पर, असली Firebase को नहीं छूता।
  # database.rules.json main पर merge होते ही असली Firebase पर लग जाते हैं (deploy-rules.yml), इसलिए
  # यहां हर खाते (हर HQ का लाइनमैन, JE, anonymous, बिना login) से सचमुच पढ़/लिखकर देखा जाता है
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:rules

  # साप्ताहिक बैकअप का पासवर्ड-ताला (scripts/encrypt-backup.py) — टूटे तो रविवार से पहले पता चले
  backup-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: pip install --quiet msoffcrypto-tool==5.4.2
      - run: npm run test:backup
